name: omnirelay

services:
  omnirelay:
    image: ghcr.io/nergis0318/omnirelay:latest
    container_name: omnirelay
    env_file:
      - .env
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_PATH: /app/data/omnirelay.db
    volumes:
      - omnirelay-data:/app/data
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  omnirelay-data:
